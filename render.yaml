databases:
  - name: earnview-db
    plan: free
    databaseName: earnview
    user: earnview

services:
  - type: web
    name: earnview
    env: node
    region: oregon
    plan: free
    buildCommand: "npm install -g pnpm@10 && pnpm install && pnpm --filter @workspace/earnview run build && pnpm --filter @workspace/api-server run build"
    startCommand: "node --enable-source-maps artifacts/api-server/dist/index.mjs"
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: earnview-db
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
